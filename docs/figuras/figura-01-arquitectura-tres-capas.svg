<svg xmlns="http://www.w3.org/2000/svg" width="920" height="790" viewBox="0 0 920 790">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .cap    { font-size: 15px; font-weight: bold; letter-spacing: 1.5px; fill: #ffffff; }
    .stack  { font-size: 12px; fill: #cbd5e1; }
    .mod    { font-size: 13px; font-weight: bold; }
    .desc   { font-size: 11px; fill: #475569; }
    .nota   { font-size: 11px; fill: #64748b; font-style: italic; }
    .flecha { font-size: 11.5px; fill: #1e3a8a; }
    .flechab{ font-size: 11.5px; fill: #1e3a8a; font-weight: bold; }
  </style>
  <defs>
    <marker id="pf" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e3a8a"/>
    </marker>
    <clipPath id="c1"><rect x="70" y="30"  width="780" height="182" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="70" y="304" width="780" height="182" rx="10"/></clipPath>
    <clipPath id="c3"><rect x="70" y="578" width="780" height="182" rx="10"/></clipPath>
  </defs>

  <rect width="920" height="790" fill="#ffffff"/>

  <!-- ================= CAPA DE PRESENTACIÓN ================= -->
  <g clip-path="url(#c1)">
    <rect x="70" y="30" width="780" height="182" fill="#f8fafc"/>
    <rect x="70" y="30" width="780" height="42" fill="#1e293b"/>
  </g>
  <rect x="70" y="30" width="780" height="182" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
  <text class="cap"   x="90"  y="57">CAPA DE PRESENTACIÓN</text>
  <text class="stack" x="830" y="57" text-anchor="end">React 19 · Vite 7 · React Router 7 — SPA</text>

  <rect x="90"  y="88" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="177" y="112" text-anchor="middle">Landing pública</text>
  <text class="desc" x="177" y="131" text-anchor="middle">Inicio · Planes</text>
  <text class="desc" x="177" y="147" text-anchor="middle">Sobre nosotros · Login</text>

  <rect x="279" y="88" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="366" y="112" text-anchor="middle">Panel Administrador</text>
  <text class="desc" x="366" y="131" text-anchor="middle">Socios · Planes · Pagos</text>
  <text class="desc" x="366" y="147" text-anchor="middle">Accesos · Correos</text>

  <rect x="468" y="88" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="555" y="112" text-anchor="middle">Panel Entrenador</text>
  <text class="desc" x="555" y="131" text-anchor="middle">Alumnos · Rutinas</text>
  <text class="desc" x="555" y="147" text-anchor="middle">Plantillas · Agenda</text>

  <rect x="657" y="88" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="744" y="112" text-anchor="middle">Panel Socio</text>
  <text class="desc" x="744" y="131" text-anchor="middle">Rutina · Progreso</text>
  <text class="desc" x="744" y="147" text-anchor="middle">Clases · Pago</text>

  <text class="nota" x="460" y="190" text-anchor="middle">25 páginas de interfaz · 21 componentes reutilizables · 14 rutas de navegación protegidas por rol</text>

  <!-- ================= FLECHAS 1 -> 2 ================= -->
  <line x1="280" y1="216" x2="280" y2="298" stroke="#1e3a8a" stroke-width="2" marker-end="url(#pf)"/>
  <text class="flechab" x="265" y="248" text-anchor="end">Petición HTTPS · JSON</text>
  <text class="flecha"  x="265" y="266" text-anchor="end">Authorization: Bearer &lt;JWT&gt;</text>
  <text class="flecha"  x="265" y="284" text-anchor="end">cliente axios</text>

  <line x1="640" y1="298" x2="640" y2="216" stroke="#1e3a8a" stroke-width="2" marker-end="url(#pf)"/>
  <text class="flechab" x="655" y="248">Respuesta JSON</text>
  <text class="flecha"  x="655" y="266">{ success, data, message }</text>
  <text class="flecha"  x="655" y="284">códigos 200 · 400 · 401 · 403</text>

  <!-- ================= CAPA DE LÓGICA DE NEGOCIO ================= -->
  <g clip-path="url(#c2)">
    <rect x="70" y="304" width="780" height="182" fill="#f8fafc"/>
    <rect x="70" y="304" width="780" height="42" fill="#1e293b"/>
  </g>
  <rect x="70" y="304" width="780" height="182" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
  <text class="cap"   x="90"  y="331">CAPA DE LÓGICA DE NEGOCIO</text>
  <text class="stack" x="830" y="331" text-anchor="end">Node.js 22 · Express 5 — API REST</text>

  <rect x="90"  y="362" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="177" y="386" text-anchor="middle">Rutas</text>
  <text class="desc" x="177" y="405" text-anchor="middle">14 archivos de rutas</text>
  <text class="desc" x="177" y="421" text-anchor="middle">Express Router</text>

  <rect x="279" y="362" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="366" y="386" text-anchor="middle">Middleware</text>
  <text class="desc" x="366" y="405" text-anchor="middle">Verificación del JWT</text>
  <text class="desc" x="366" y="421" text-anchor="middle">Control de rol y propiedad</text>

  <rect x="468" y="362" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="555" y="386" text-anchor="middle">Controladores</text>
  <text class="desc" x="555" y="405" text-anchor="middle">15 controladores</text>
  <text class="desc" x="555" y="421" text-anchor="middle">Reglas de negocio</text>

  <rect x="657" y="362" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="744" y="386" text-anchor="middle">Servicios</text>
  <text class="desc" x="744" y="405" text-anchor="middle">Correo · PayPal</text>
  <text class="desc" x="744" y="421" text-anchor="middle">Almacenamiento de archivos</text>

  <text class="nota" x="460" y="464" text-anchor="middle">79 endpoints REST · manejador global de errores · tareas programadas (node-cron) activas en una sola instancia</text>

  <!-- ================= FLECHAS 2 -> 3 ================= -->
  <line x1="280" y1="490" x2="280" y2="572" stroke="#1e3a8a" stroke-width="2" marker-end="url(#pf)"/>
  <text class="flechab" x="265" y="522" text-anchor="end">Consulta parametrizada</text>
  <text class="flecha"  x="265" y="540" text-anchor="end">driver mssql · TDS puerto 1433</text>
  <text class="flecha"  x="265" y="558" text-anchor="end">pool de conexiones</text>

  <line x1="640" y1="572" x2="640" y2="490" stroke="#1e3a8a" stroke-width="2" marker-end="url(#pf)"/>
  <text class="flechab" x="655" y="522">Conjunto de resultados</text>
  <text class="flecha"  x="655" y="540">recordset</text>
  <text class="flecha"  x="655" y="558">transacciones</text>

  <!-- ================= CAPA DE DATOS ================= -->
  <g clip-path="url(#c3)">
    <rect x="70" y="578" width="780" height="182" fill="#f8fafc"/>
    <rect x="70" y="578" width="780" height="42" fill="#1e293b"/>
  </g>
  <rect x="70" y="578" width="780" height="182" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
  <text class="cap"   x="90"  y="605">CAPA DE DATOS</text>
  <text class="stack" x="830" y="605" text-anchor="end">Microsoft SQL Server 2022 Express — GymDatabase</text>

  <rect x="90"  y="636" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="177" y="660" text-anchor="middle">23 tablas</text>
  <text class="desc" x="177" y="679" text-anchor="middle">tercera forma normal</text>
  <text class="desc" x="177" y="695" text-anchor="middle">integridad referencial</text>

  <rect x="279" y="636" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="366" y="660" text-anchor="middle">Procedimientos</text>
  <text class="desc" x="366" y="679" text-anchor="middle">almacenados y</text>
  <text class="desc" x="366" y="695" text-anchor="middle">disparadores de auditoría</text>

  <rect x="468" y="636" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="555" y="660" text-anchor="middle">Índices</text>
  <text class="desc" x="555" y="679" text-anchor="middle">sobre las consultas</text>
  <text class="desc" x="555" y="695" text-anchor="middle">de mayor frecuencia</text>

  <rect x="657" y="636" width="174" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="mod"  x="744" y="660" text-anchor="middle">Volumen sqldata</text>
  <text class="desc" x="744" y="679" text-anchor="middle">persistencia fuera</text>
  <text class="desc" x="744" y="695" text-anchor="middle">del ciclo del contenedor</text>

  <text class="nota" x="460" y="738" text-anchor="middle">Ninguna capa superior accede a la base de datos sin pasar por la capa de lógica de negocio</text>
</svg>
