  <text class="este" x="625" y="122">&#171;extend&#187;</text>
  <text class="este" x="625" y="292">&#171;extend&#187;</text>
  <text class="este" x="625" y="452">&#171;include&#187;</text>
  <text class="este" x="646" y="496">&#171;include&#187;</text>
  <text class="este" x="625" y="772">&#171;extend&#187;</text>
  <text class="este" x="625" y="932">&#171;include&#187;</text>
  <text class="este" x="625" y="1012">&#171;extend&#187;</text>
  <text class="este" x="625" y="1172">&#171;include&#187;</text>
