  <text class="este" x="625" y="1332">&#171;extend&#187;</text>

  <!-- ================== LEYENDA ================== -->
  <rect x="250" y="1418" width="810" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <g stroke="#111827" stroke-width="1.4" fill="none">
    <line x1="266" y1="1434" x2="306" y2="1434"/>
  </g>
  <text class="legb" x="314" y="1438">Asociación</text>
  <text class="leg"  x="382" y="1438">el actor participa en el caso de uso</text>
  <g stroke="#111827" stroke-width="1.4" fill="none">
    <line x1="266" y1="1452" x2="300" y2="1452" marker-end="url(#hueca)"/>
  </g>
  <text class="legb" x="314" y="1456">Generalización</text>
  <text class="leg"  x="400" y="1456">los tres roles heredan los casos de uso comunes</text>
  <g stroke="#1e3a8a" stroke-width="1.3" stroke-dasharray="7 4" fill="none">
    <line x1="700" y1="1434" x2="740" y2="1434" marker-end="url(#abierta)"/>
  </g>
  <text class="legb" x="750" y="1438">&#171;include&#187;</text>
  <text class="leg"  x="812" y="1438">comportamiento siempre ejecutado</text>
  <text class="legb" x="750" y="1456">&#171;extend&#187;</text>
  <text class="leg"  x="812" y="1456">comportamiento opcional del caso base</text>
