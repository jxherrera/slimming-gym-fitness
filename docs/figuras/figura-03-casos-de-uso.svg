  <text class="ucs" x="850" y="465">Aprobar o rechazar el comprobante</text>
  <text class="ucs" x="850" y="545">Notificar por correo electrónico</text>
  <text class="ucs" x="850" y="785">Aplicar una plantilla de rutina</text>
