  <text class="uc" x="430" y="305">Gestionar socios</text>
  <text class="uc" x="430" y="385">Gestionar planes y membresías</text>
  <text class="uc" x="430" y="465">Verificar comprobante de pago</text>
  <text class="uc" x="430" y="545">Registrar ingreso al gimnasio</text>
  <text class="uc" x="430" y="625">Consultar reportes e indicadores</text>
  <text class="uc" x="430" y="705">Gestionar alumnos asignados</text>
  <text class="uc" x="430" y="785">Crear y asignar rutina</text>
