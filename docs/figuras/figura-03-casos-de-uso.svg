    <line x1="70"  y1="462" x2="130" y2="462"/>
    <line x1="100" y1="492" x2="78"  y2="530"/>
    <line x1="100" y1="492" x2="122" y2="530"/>
  </g>
  <text class="act" x="100" y="552">Administrador</text>

