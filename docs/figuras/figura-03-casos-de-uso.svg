<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="1475" viewBox="0 0 1090 1475">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .uc     { font-size: 12.5px; text-anchor: middle; }
    .ucs    { font-size: 12.5px; text-anchor: middle; fill: #1e3a8a; }
    .act    { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .sist   { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #334155; letter-spacing: 0.5px; }
    .este   { font-size: 10.5px; text-anchor: middle; fill: #1e3a8a; font-style: italic; }
    .leg    { font-size: 11px; fill: #475569; }
    .legb   { font-size: 11px; fill: #475569; font-weight: bold; }
  </style>
  <defs>
    <marker id="abierta" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M1,1 L11,5 L1,9" fill="none" stroke="#1e3a8a" stroke-width="1.4"/>
    </marker>
    <marker id="hueca" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M1,1 L13,6 L1,11 z" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="1090" height="1475" fill="#ffffff"/>

  <!-- ================== LIMITE DEL SISTEMA ================== -->
