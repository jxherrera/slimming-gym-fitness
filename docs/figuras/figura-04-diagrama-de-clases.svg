<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .cn   { font-size: 13.5px; font-weight: bold; text-anchor: middle; }
    .at   { font-size: 10.5px; }
    .me   { font-size: 10.5px; fill: #1e3a8a; }
    .mul  { font-size: 10px; fill: #b91c1c; font-weight: bold; }
    .nota { font-size: 10.5px; fill: #475569; }
    .pie  { font-size: 11px; fill: #475569; font-style: italic; }
  </style>

  <rect width="1400" height="1050" fill="#ffffff"/>

  <!-- ==================== ASOCIACIONES ==================== -->
  <g stroke="#111827" stroke-width="1.3" fill="none">
    <line x1="400" y1="430" x2="560" y2="430"/>
    <line x1="430" y1="620" x2="560" y2="620"/>
    <line x1="700" y1="380" x2="700" y2="280"/>
    <line x1="450" y1="185" x2="560" y2="185"/>
    <line x1="840" y1="185" x2="960" y2="185"/>
    <line x1="840" y1="420" x2="960" y2="420"/>
    <line x1="1105" y1="537" x2="1105" y2="560"/>
    <line x1="920" y1="880" x2="941" y2="880"/>
    <!-- Usuario -> fila inferior (izquierda) -->
    <path d="M570,630 L570,740 L128,740 L128,800"/>
    <path d="M610,630 L610,755 L357,755 L357,800"/>
    <path d="M650,630 L650,770 L586,770 L586,800"/>
    <!-- Usuario -> fila inferior (derecha) -->
    <path d="M750,630 L750,770 L815,770 L815,800"/>
    <path d="M790,630 L790,755 L1044,755 L1044,800"/>
    <path d="M830,630 L830,740 L1273,740 L1273,800"/>
  </g>

  <!-- rombos de composición -->
  <g fill="#111827" stroke="#111827" stroke-width="1">
    <polygon points="1105,537 1113,550 1105,563 1097,550"/>
    <polygon points="920,880 933,873 946,880 933,887"/>
    <polygon points="570,630 578,643 570,656 562,643"/>
    <polygon points="830,630 838,643 830,656 822,643"/>
  </g>

  <!-- multiplicidades -->
  <g class="mul">
    <text x="408" y="424">1</text>      <text x="552" y="424" text-anchor="end">0..*</text>
    <text x="438" y="614">1</text>      <text x="552" y="614" text-anchor="end">0..1</text>
    <text x="706" y="376">1</text>      <text x="706" y="298">0..*</text>
    <text x="458" y="179">1</text>      <text x="552" y="179" text-anchor="end">0..*</text>
    <text x="834" y="179" text-anchor="end">1</text>  <text x="968" y="179">0..*</text>
    <text x="846" y="414">1</text>      <text x="952" y="414" text-anchor="end">0..*</text>
    <text x="1114" y="556">1</text>     <text x="1114" y="578">1..*</text>
    <text x="912" y="872" text-anchor="end">1</text>  <text x="950" y="872">0..*</text>
    <text x="580" y="668">1</text>      <text x="134" y="794">0..*</text>
    <text x="620" y="668">1</text>      <text x="363" y="794">0..*</text>
    <text x="660" y="668">1</text>      <text x="592" y="794">0..*</text>
    <text x="740" y="668" text-anchor="end">1</text>  <text x="821" y="794">0..*</text>
    <text x="780" y="668" text-anchor="end">1</text>  <text x="1050" y="794">0..*</text>
    <text x="820" y="668" text-anchor="end">1</text>  <text x="1279" y="794">0..*</text>
  </g>

  <!-- ==================== CLASES ==================== -->

  <!-- PLAN -->
  <g>
    <rect x="200" y="105" width="250" height="160" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="200" y1="140" x2="450" y2="140" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="325" y="131">Plan</text>
    <text class="at" x="210" y="160">- idPlan : int {PK}</text>
    <text class="at" x="210" y="177">- nombre : varchar(50)</text>
    <text class="at" x="210" y="194">- precio : decimal(10,2)</text>
    <text class="at" x="210" y="211">- duracionDias : int</text>
    <text class="at" x="210" y="228">- estado : char(1)</text>
    <line x1="200" y1="238" x2="450" y2="238" stroke="#334155" stroke-width="1.2"/>
    <text class="me" x="210" y="256">+ calcularFechaFin(inicio)</text>
  </g>

  <!-- SUSCRIPCION -->
  <g>
    <rect x="560" y="90" width="280" height="190" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="560" y1="125" x2="840" y2="125" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="700" y="116">Suscripcion</text>
    <text class="at" x="570" y="145">- idSuscripcion : int {PK}</text>
    <text class="at" x="570" y="162">- idUsuario : int {FK}</text>
    <text class="at" x="570" y="179">- idPlan : int {FK}</text>
    <text class="at" x="570" y="196">- fechaInicio : date</text>
    <text class="at" x="570" y="213">- fechaFin : date</text>
    <text class="at" x="570" y="230">- estadoPago : char(1) {P | U}</text>
    <line x1="560" y1="240" x2="840" y2="240" stroke="#334155" stroke-width="1.2"/>
    <text class="me" x="570" y="258">+ estaVigente() : bool</text>
    <text class="me" x="570" y="275">+ diasRestantes() : int</text>
  </g>

  <!-- PAGO -->
  <g>
    <rect x="960" y="70" width="290" height="240" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="960" y1="105" x2="1250" y2="105" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="1105" y="96">Pago</text>
    <text class="at" x="970" y="125">- idPago : int {PK}</text>
    <text class="at" x="970" y="142">- idSuscripcion : int {FK}</text>
    <text class="at" x="970" y="159">- monto : decimal(10,2)</text>
    <text class="at" x="970" y="176">- fecha : datetime</text>
    <text class="at" x="970" y="193">- metodo : varchar(50)</text>
    <text class="at" x="970" y="210">- referencia : varchar(100)</text>
    <text class="at" x="970" y="227">- urlComprobante : varchar(500)</text>
    <text class="at" x="970" y="244">- estado : char(1) {A | P | R}</text>
    <text class="at" x="970" y="261">- revisadoPor : int {FK}</text>
    <line x1="960" y1="271" x2="1250" y2="271" stroke="#334155" stroke-width="1.2"/>
    <text class="me" x="970" y="289">+ aprobar(idAdministrador)</text>
    <text class="me" x="970" y="306">+ rechazar(idAdministrador)</text>
  </g>

  <!-- NOTA UML -->
  <g>
    <path d="M370,292 L578,292 L594,308 L594,376 L370,376 z" fill="#fefce8" stroke="#a16207" stroke-width="1.2"/>
    <path d="M578,292 L578,308 L594,308" fill="none" stroke="#a16207" stroke-width="1.2"/>
    <text class="nota" x="380" y="314">Usuario cumple tres perfiles. Por eso</text>
    <text class="nota" x="380" y="331">Rutina, EvaluacionFisica y Clase lo</text>
    <text class="nota" x="380" y="348">referencian dos veces: una como</text>
    <text class="nota" x="380" y="365">socio y otra como entrenador.</text>
  </g>
  <line x1="594" y1="360" x2="628" y2="382" stroke="#a16207" stroke-width="1.1" stroke-dasharray="5 4"/>

  <!-- ROL -->
  <g>
    <rect x="180" y="390" width="220" height="100" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="180" y1="425" x2="400" y2="425" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="290" y="416">Rol</text>
    <text class="at" x="190" y="445">- idRol : int {PK}</text>
    <text class="at" x="190" y="462">- nombre : varchar(50)</text>
    <text class="nota" x="190" y="480">{Admin | Coach | Member | Guest}</text>
  </g>

  <!-- USUARIO -->
  <g>
    <rect x="560" y="380" width="280" height="250" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <line x1="560" y1="415" x2="840" y2="415" stroke="#334155" stroke-width="2"/>
    <text class="cn" x="700" y="406">Usuario</text>
    <text class="at" x="570" y="435">- idUsuario : int {PK}</text>
    <text class="at" x="570" y="452">- cédula : varchar(15) {único}</text>
    <text class="at" x="570" y="469">- nombres : varchar(100)</text>
    <text class="at" x="570" y="486">- apellidos : varchar(100)</text>
    <text class="at" x="570" y="503">- correo : varchar(150) {único}</text>
    <text class="at" x="570" y="520">- clave : varchar(255) {bcrypt}</text>
    <text class="at" x="570" y="537">- teléfono : varchar(20)</text>
    <text class="at" x="570" y="554">- estado : char(1) {A | I}</text>
    <text class="at" x="570" y="571">- fechaRegistro : datetime</text>
    <line x1="560" y1="581" x2="840" y2="581" stroke="#334155" stroke-width="1.2"/>
    <text class="me" x="570" y="599">+ autenticar(correo, clave)</text>
    <text class="me" x="570" y="616">+ restablecerClave(token)</text>
  </g>

  <!-- ASIGNACION ENTRENADOR -->
  <g>
    <rect x="180" y="560" width="250" height="120" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="180" y1="595" x2="430" y2="595" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="305" y="586">AsignacionEntrenador</text>
    <text class="at" x="190" y="615">- idAsignacion : int {PK}</text>
    <text class="at" x="190" y="632">- idEntrenador : int {FK}</text>
    <text class="at" x="190" y="649">- idSocio : int {FK, único}</text>
    <text class="at" x="190" y="666">- fechaAsignacion : datetime</text>
  </g>

  <!-- RUTINA -->
  <g>
    <rect x="960" y="330" width="290" height="207" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="960" y1="365" x2="1250" y2="365" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="1105" y="356">Rutina</text>
    <text class="at" x="970" y="385">- idRutina : int {PK}</text>
    <text class="at" x="970" y="402">- idSocio : int {FK}</text>
    <text class="at" x="970" y="419">- idEntrenador : int {FK}</text>
    <text class="at" x="970" y="436">- nombre : varchar(100)</text>
    <text class="at" x="970" y="453">- objetivo : varchar(255)</text>
    <text class="at" x="970" y="470">- estado : char(1)</text>
    <text class="at" x="970" y="487">- fechaAsignacion : datetime</text>
    <line x1="960" y1="497" x2="1250" y2="497" stroke="#334155" stroke-width="1.2"/>
    <text class="me" x="970" y="515">+ asignarASocio(idSocio)</text>
    <text class="me" x="970" y="532">+ exportarPDF()</text>
  </g>

  <!-- EJERCICIO RUTINA -->
  <g>
    <rect x="960" y="560" width="290" height="165" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="960" y1="595" x2="1250" y2="595" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="1105" y="586">EjercicioRutina</text>
    <text class="at" x="970" y="615">- idEjercicio : int {PK}</text>
    <text class="at" x="970" y="632">- idRutina : int {FK}</text>
    <text class="at" x="970" y="649">- nombre : nvarchar(150)</text>
    <text class="at" x="970" y="666">- series : int</text>
    <text class="at" x="970" y="683">- repeticiones : int</text>
    <text class="at" x="970" y="700">- peso : decimal(5,2)</text>
    <text class="at" x="970" y="717">- dia : nvarchar(20)</text>
  </g>

  <!-- ============ FILA INFERIOR ============ -->

  <g>
    <rect x="25" y="800" width="205" height="122" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="25" y1="835" x2="230" y2="835" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="128" y="826">Asistencia</text>
    <text class="at" x="35" y="855">- idAsistencia : int {PK}</text>
    <text class="at" x="35" y="872">- idUsuario : int {FK}</text>
    <text class="at" x="35" y="889">- fechaHora : datetime</text>
    <line x1="25" y1="899" x2="230" y2="899" stroke="#334155" stroke-width="1.2"/>
    <text class="me" x="35" y="917">+ registrarIngreso()</text>
  </g>

  <g>
    <rect x="254" y="800" width="205" height="165" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="254" y1="835" x2="459" y2="835" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="357" y="826">EvaluacionFisica</text>
    <text class="at" x="264" y="855">- idEvaluacion : int {PK}</text>
    <text class="at" x="264" y="872">- idSocio : int {FK}</text>
    <text class="at" x="264" y="889">- idEntrenador : int {FK}</text>
    <text class="at" x="264" y="906">- pesoKg : decimal(5,2)</text>
    <text class="at" x="264" y="923">- grasaCorporal : decimal(5,2)</text>
    <text class="at" x="264" y="940">- masaMuscular : decimal(5,2)</text>
    <text class="at" x="264" y="957">- fecha : datetime</text>
  </g>

  <g>
    <rect x="483" y="800" width="205" height="131" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="483" y1="835" x2="688" y2="835" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="586" y="826">SesionEntrenamiento</text>
    <text class="at" x="493" y="855">- idSesion : int {PK}</text>
    <text class="at" x="493" y="872">- idSocio : int {FK}</text>
    <text class="at" x="493" y="889">- idRutina : int {FK}</text>
    <text class="at" x="493" y="906">- fecha : datetime</text>
    <text class="at" x="493" y="923">- totalEjercicios : int</text>
  </g>

  <g>
    <rect x="712" y="800" width="208" height="148" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="712" y1="835" x2="920" y2="835" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="816" y="826">Clase</text>
    <text class="at" x="722" y="855">- idClase : int {PK}</text>
    <text class="at" x="722" y="872">- nombre : nvarchar(150)</text>
    <text class="at" x="722" y="889">- idEntrenador : int {FK}</text>
    <text class="at" x="722" y="906">- inicio : datetime</text>
    <text class="at" x="722" y="923">- fin : datetime</text>
    <text class="at" x="722" y="940">- cupoMaximo : int</text>
  </g>

  <g>
    <rect x="941" y="800" width="205" height="114" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="941" y1="835" x2="1146" y2="835" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="1044" y="826">ReservaClase</text>
    <text class="at" x="951" y="855">- idReserva : int {PK}</text>
    <text class="at" x="951" y="872">- idClase : int {FK}</text>
    <text class="at" x="951" y="889">- idSocio : int {FK}</text>
    <text class="at" x="951" y="906">- fechaReserva : datetime</text>
  </g>

  <g>
    <rect x="1170" y="800" width="205" height="148" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <line x1="1170" y1="835" x2="1375" y2="835" stroke="#334155" stroke-width="1.6"/>
    <text class="cn" x="1273" y="826">Notificacion</text>
    <text class="at" x="1180" y="855">- idNotificacion : int {PK}</text>
    <text class="at" x="1180" y="872">- idUsuario : int {FK}</text>
    <text class="at" x="1180" y="889">- titulo : varchar(100)</text>
    <text class="at" x="1180" y="906">- mensaje : varchar(255)</text>
    <text class="at" x="1180" y="923">- tipo : varchar(50)</text>
    <text class="at" x="1180" y="940">- leida : bit</text>
  </g>

  <!-- ==================== PIE ==================== -->
  <text class="pie" x="25" y="1005">El rombo relleno indica composición: al eliminar el objeto contenedor se eliminan sus partes (borrado en cascada declarado en la base de datos).</text>
  <text class="pie" x="25" y="1027">Se representan las 13 entidades centrales del dominio; las 10 tablas restantes (plantillas, catálogo, detalle de sesiones y bitácoras) se omiten por claridad.</text>
</svg>
