<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .ttl  { font-size: 14px; font-weight: bold; }
    .ste  { font-size: 10.5px; fill: #64748b; font-style: italic; }
    .srv  { font-size: 13.5px; font-weight: bold; }
    .esp  { font-size: 10.5px; fill: #475569; }
    .rep  { font-size: 11.5px; font-weight: bold; fill: #1d4ed8; }
    .fle  { font-size: 10.5px; fill: #1e3a8a; font-weight: bold; }
    .mon  { font-size: 10.5px; fill: #7c2d12; font-weight: bold; }
    .vol  { font-size: 12.5px; font-weight: bold; }
    .volt { font-size: 10px; fill: #475569; }
    .pie  { font-size: 11px; fill: #475569; font-style: italic; }
  </style>
  <defs>
    <marker id="f1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1e3a8a"/>
    </marker>
    <marker id="f2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#7c2d12"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- ================= MAQUINA VIRTUAL ================= -->
  <rect x="40" y="110" width="1120" height="700" rx="8" fill="#fbfcfd" stroke="#334155" stroke-width="2"/>
  <text class="ttl" x="60" y="136">Máquina virtual Linux  ·  Docker Engine + Docker Compose</text>

  <!-- ================= INTERNET ================= -->
  <rect x="140" y="24" width="220" height="46" rx="23" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text class="ttl" x="250" y="53" text-anchor="middle">Internet</text>
  <line x1="250" y1="70" x2="250" y2="244" stroke="#1e3a8a" stroke-width="2" marker-end="url(#f1)"/>
  <rect x="272" y="74" width="164" height="30" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text class="fle" x="354" y="93" text-anchor="middle">80:80   ·   443:443</text>
  <text class="fle" x="450" y="93">HTTPS  ·  los únicos puertos publicados de todo el sistema</text>

  <!-- ================= RED INTERNA ================= -->
  <rect x="70" y="188" width="770" height="590" rx="6" fill="#f8fafc" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="9 5"/>
  <text class="ste" x="88" y="210">&#171;network&#187;  driver bridge</text>
  <text class="srv" x="88" y="230" fill="#0f766e">interna</text>
  <text class="esp" x="182" y="230">los contenedores se localizan por el nombre del servicio, no por dirección IP</text>

  <!-- proxy -->
  <g>
    <rect x="100" y="250" width="300" height="128" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text class="ste" x="114" y="270">&#171;container&#187;  slimming-proxy</text>
    <text class="srv" x="114" y="290">proxy</text>
    <text class="rep" x="386" y="290" text-anchor="end">1 réplica</text>
    <text class="esp" x="114" y="310">nginx:1.27-alpine</text>
    <text class="esp" x="114" y="328">sirve el frontend compilado (React + Vite)</text>
    <text class="esp" x="114" y="346">balancea /api entre las réplicas activas</text>
    <text class="esp" x="114" y="364">entrega /uploads en modo solo lectura</text>
  </g>

  <!-- api -->
  <g>
    <rect x="450" y="240" width="360" height="234" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text class="ste" x="464" y="260">&#171;container&#187;  escalado horizontal</text>
    <text class="srv" x="464" y="280">api</text>
    <text class="rep" x="796" y="280" text-anchor="end">N réplicas</text>
    <rect x="470" y="292" width="320" height="44" rx="4" fill="#ffffff" stroke="#64748b"/>
    <text class="srv" x="484" y="312" font-size="12">api-1</text>
    <text class="esp" x="484" y="328">node:22-alpine  ·  puerto interno 5001</text>
    <rect x="470" y="344" width="320" height="44" rx="4" fill="#ffffff" stroke="#64748b"/>
    <text class="srv" x="484" y="364" font-size="12">api-2</text>
    <text class="esp" x="484" y="380">sin puertos publicados</text>
    <rect x="470" y="396" width="320" height="44" rx="4" fill="#ffffff" stroke="#64748b"/>
    <text class="srv" x="484" y="416" font-size="12">api-3</text>
    <text class="esp" x="484" y="432">ENABLE_CRON = false</text>
    <text class="esp" x="464" y="460">Sin estado en memoria: la sesión viaja en el token JWT.</text>
  </g>

  <!-- worker -->
  <g>
    <rect x="100" y="420" width="300" height="118" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text class="ste" x="114" y="440">&#171;container&#187;  slimming-worker</text>
    <text class="srv" x="114" y="460">worker</text>
    <text class="rep" x="386" y="460" text-anchor="end">1 réplica fija</text>
    <text class="esp" x="114" y="480">misma imagen que la API</text>
    <text class="esp" x="114" y="498">ENABLE_CRON = true</text>
    <text class="esp" x="114" y="516">único proceso con tareas programadas</text>
  </g>

  <!-- db -->
  <g>
    <rect x="450" y="524" width="360" height="128" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text class="ste" x="464" y="544">&#171;container&#187;  slimming-db</text>
    <text class="srv" x="464" y="564">db</text>
    <text class="rep" x="796" y="564" text-anchor="end">1 réplica</text>
    <text class="esp" x="464" y="584">mcr.microsoft.com/mssql/server:2022-latest</text>
    <text class="esp" x="464" y="602">edición Express  ·  base GymDatabase</text>
    <text class="esp" x="464" y="620">puerto 1433 sin publicar hacia el exterior</text>
    <text class="esp" x="464" y="638">sonda de estado con sqlcmd cada 15 s</text>
  </g>

  <!-- enlaces de red -->
  <g stroke="#1e3a8a" stroke-width="1.8" fill="none" marker-end="url(#f1)">
    <path d="M400,312 H444"/>
    <path d="M630,474 V518"/>
    <path d="M400,478 H424 V596 H444"/>
  </g>
  <text class="fle" x="404" y="304">round-robin</text>
  <text class="fle" x="640" y="500">TDS 1433</text>
  <text class="fle" x="248" y="560">consultas del cron</text>

  <!-- ================= VOLUMENES ================= -->
  <text class="ttl" x="1000" y="212" text-anchor="middle">Volúmenes con nombre</text>

  <g>
    <path d="M930,260 v76 a60,15 0 0 0 120,0 v-76" fill="#fef3c7" stroke="#a16207" stroke-width="1.6"/>
    <ellipse cx="990" cy="260" rx="60" ry="15" fill="#fde68a" stroke="#a16207" stroke-width="1.6"/>
    <text class="vol"  x="990" y="292" text-anchor="middle">sqldata</text>
    <text class="volt" x="990" y="310" text-anchor="middle">/var/opt/mssql</text>
    <text class="volt" x="990" y="326" text-anchor="middle">archivos de la base</text>
  </g>
  <g>
    <path d="M930,450 v76 a60,15 0 0 0 120,0 v-76" fill="#fef3c7" stroke="#a16207" stroke-width="1.6"/>
    <ellipse cx="990" cy="450" rx="60" ry="15" fill="#fde68a" stroke="#a16207" stroke-width="1.6"/>
    <text class="vol"  x="990" y="482" text-anchor="middle">uploads</text>
    <text class="volt" x="990" y="500" text-anchor="middle">/app/uploads</text>
    <text class="volt" x="990" y="516" text-anchor="middle">comprobantes de pago</text>
  </g>
  <g>
    <path d="M930,640 v62 a60,15 0 0 0 120,0 v-62" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
    <ellipse cx="990" cy="640" rx="60" ry="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
    <text class="vol"  x="990" y="672" text-anchor="middle" fill="#475569">certbot-webroot</text>
    <text class="volt" x="990" y="690" text-anchor="middle">volumen auxiliar</text>
    <text class="volt" x="990" y="706" text-anchor="middle">renovación del certificado</text>
  </g>

  <!-- montajes -->
  <g stroke="#7c2d12" stroke-width="1.5" fill="none" marker-end="url(#f2)">
    <path d="M810,566 H876 V300 H926"/>
    <path d="M810,356 H890 V486 H926"/>
    <path d="M400,392 H424 V736 H900 V520 H926"/>
    <path d="M100,340 H80 V762 H912 V676 H926"/>
  </g>
  <text class="mon" x="882" y="270">lectura y escritura</text>
  <text class="mon" x="896" y="420">lectura y escritura</text>
  <text class="mon" x="640" y="730">proxy: solo lectura</text>
  <text class="mon" x="600" y="756">proxy: raíz de validación ACME</text>

  <!-- ================= PIE ================= -->
  <text class="pie" x="40" y="846">Los contenedores son desechables: `docker compose down` los destruye sin pérdida de información porque el estado vive en los volúmenes, no en el contenedor.</text>
  <text class="pie" x="40" y="866">El volumen uploads lo comparten todas las réplicas de la API. Si cada una guardara sus archivos por separado, un comprobante subido a api-1 no existiría para api-2.</text>
  <text class="pie" x="40" y="886">Escalado:  docker compose up -d --scale api=3.  El servicio worker nunca se escala: cada réplica adicional enviaría un aviso de vencimiento duplicado a cada socio.</text>
</svg>
