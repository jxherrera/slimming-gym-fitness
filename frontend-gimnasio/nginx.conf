# Proxy inverso y balanceador de Slimming Gym Fitness
#
# Este archivo lo copia el Dockerfile multietapa del frontend a
# /etc/nginx/conf.d/default.conf. Cumple tres funciones:
#   1. Servir el frontend compilado (React + Vite)
#   2. Repartir /api entre las replicas del servicio 'api'
#   3. Servir /uploads desde el volumen compartido de comprobantes
#
# Autoria: el bloque de balanceo y proxy lo mantiene Josue (backend e
# infraestructura); la integracion con el Dockerfile, Kevin (frontend).

# Resolutor DNS interno de Docker.
# IMPRESCINDIBLE: sin esta directiva Nginx resuelve el nombre 'api' una unica vez
# al arrancar y queda fijado a la IP de la primera replica. El balanceo no
# ocurriria y escalar con --scale api=3 no tendria ningun efecto visible.
resolver 127.0.0.11 valid=10s ipv6=off;

# Bloque HTTP: unicamente redirige a HTTPS.
# Se conserva /.well-known/acme-challenge para que Certbot pueda renovar el
# certificado sin detener el servicio.
server {
    listen 80;
    server_name slimminggym.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name slimminggym.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/slimminggym.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slimminggym.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Obliga al navegador a usar HTTPS en las visitas siguientes.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Los comprobantes de pago admiten hasta 5 MB en el backend; se deja algo de
    # margen para la sobrecarga de la codificacion multipart.
    client_max_body_size 6M;

    access_log /var/log/nginx/slimming.access.log;
    error_log  /var/log/nginx/slimming.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad basicas
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------------
    # Frontend compilado
    # ------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Indispensable para el enrutado del lado del cliente (React Router):
        # sin esta linea, recargar el navegador en /admin/pagos devuelve 404,
        # porque no existe ningun archivo en esa ruta. Es lo que hacia de forma
        # automatica el bloque "rewrites" de firebase.json, que ya no usamos.
        try_files $uri $uri/ /index.html;
    }

    # Los recursos llevan un hash en el nombre: se pueden cachear indefinidamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Comprobantes de pago, desde el volumen compartido en solo lectura
    # ------------------------------------------------------------------
    location /uploads/ {
        alias /app/uploads/;
        autoindex off;                       # nunca listar el directorio
        add_header X-Content-Type-Options nosniff always;
        # Los nombres son aleatorios de 32 caracteres hexadecimales, generados en
        # services/storageService.js: no se pueden enumerar ni deducir del nombre
        # original del archivo ni de la fecha de subida.
        expires 30d;
    }

    # ------------------------------------------------------------------
    # API, balanceada entre las replicas del servicio 'api'
    # ------------------------------------------------------------------
    location /api/ {
        # El uso de una variable obliga a Nginx a resolver el DNS en tiempo de
        # peticion en lugar de al arrancar. Docker devuelve una direccion
        # distinta en cada consulta (round-robin), con lo que la carga se
        # reparte entre todas las replicas activas.
        set $upstream_api api:5001;
        proxy_pass http://$upstream_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Si una replica no responde, la peticion se reintenta en la siguiente.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
